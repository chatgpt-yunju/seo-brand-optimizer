<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>竞争对手分析 - SEO品牌优化系统</title>
    <meta name="description" content="分析竞争对手网站SEO状况、关键词策略、流量预估">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .competitor-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .competitor-card { background: var(--light-gray); border-radius: 12px; padding: 20px; transition: all 0.3s; }
        .competitor-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.1); background: var(--white); }
        .competitor-header { display: flex; align-items: center; gap: 15px; margin-bottom: 15px; }
        .competitor-icon { width: 50px; height: 50px; background: var(--primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 24px; }
        .competitor-name { font-size: 18px; font-weight: 600; }
        .competitor-url { font-size: 12px; color: var(--gray); }
        .competitor-metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
        .metric-item { background: var(--white); padding: 10px; border-radius: 8px; text-align: center; }
        .metric-value { font-size: 20px; font-weight: bold; color: var(--primary); }
        .metric-label { font-size: 12px; color: var(--gray); }
        .keyword-cloud { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 15px; }
        .keyword-tag { padding: 5px 12px; background: var(--white); border-radius: 15px; font-size: 12px; }
        .keyword-tag.hot { background: #fee2e2; color: #991b1b; }
        .compare-section { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .compare-card { border: 2px solid var(--border); border-radius: 12px; padding: 20px; }
        .compare-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .compare-winner { color: var(--success); font-weight: 600; }
        .progress-compare { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
        .progress-compare .label { width: 80px; font-size: 12px; }
        .progress-compare .bar { flex: 1; height: 8px; background: var(--light-gray); border-radius: 4px; }
        .progress-compare .value { width: 40px; text-align: right; font-size: 12px; }
    </style>
</head>
<body>
    <header class="header">
        <div class="container">
            <h1>🎯 竞争对手分析</h1>
            <p class="subtitle">深度分析竞争对手SEO策略，优化自身排名</p>
        </div>
    </header>

    <nav class="nav">
        <div class="container">
            <ul class="nav-list">
                <li><a href="/">📊 SEO分析</a></li>
                <li><a href="/competitor.html" class="active">🎯 竞争对手</a></li>
                <li><a href="/batch-seo.html">📑 批量检测</a></li>
                <li><a href="/report.html">📈 报告生成</a></li>
                <li><a href="/backlinks-check.html">🔗 友链检测</a></li>
                <li><a href="/权重查询.html">⚡ 权重查询</a></li>
            </ul>
        </div>
    </nav>

    <main class="main">
        <div class="container">
            <!-- 添加竞争对手 -->
            <section class="card">
                <h2>➕ 添加竞争对手</h2>
                <div class="input-group">
                    <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                        <input type="url" id="competitorUrl" placeholder="输入竞争对手网站URL" style="flex: 1; min-width: 200px;">
                        <input type="text" id="competitorName" placeholder="竞争对手名称（可选）" style="flex: 1; min-width: 150px;">
                        <button onclick="addCompetitor()" class="btn-primary">添加分析</button>
                    </div>
                    <small>支持添加多个竞争对手进行对比分析</small>
                </div>
            </section>

            <!-- 竞争对手列表 -->
            <section class="card" id="competitorListSection" style="display: none;">
                <h2>📊 竞争对手分析结果</h2>
                <div class="competitor-grid" id="competitorGrid"></div>
            </section>

            <!-- 对比分析 -->
            <section class="card" id="compareSection" style="display: none;">
                <h2>⚔️ 对比分析</h2>
                <div class="compare-section" id="compareSectionContent"></div>
            </section>

            <!-- 关键词对比 -->
            <section class="card">
                <h2>🔑 关键词策略分析</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label>核心关键词（用逗号分隔）</label>
                        <input type="text" id="mainKeywords" placeholder="SEO优化,网站推广,品牌营销">
                    </div>
                    <div class="form-group">
                        <label>主要竞争对手（用逗号分隔域名）</label>
                        <input type="text" id="competitorDomains" placeholder="example1.com, example2.com">
                    </div>
                </div>
                <button onclick="analyzeKeywordStrategy()" class="btn-primary" style="margin-top: 15px;">分析关键词策略</button>
                <div id="keywordStrategyResult" style="margin-top: 20px;"></div>
            </section>

            <!-- 流量预估 -->
            <section class="card">
                <h2>📈 流量预估分析</h2>
                <div class="input-group">
                    <input type="url" id="trafficUrl" placeholder="输入网站URL进行流量预估">
                    <button onclick="estimateTraffic()" class="btn-primary">预估流量</button>
                </div>
                <div id="trafficResult" style="margin-top: 20px;"></div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 SEO品牌优化系统</p>
        </div>
    </footer>

    <script>
        // 竞争对手数据存储
        let competitors = JSON.parse(localStorage.getItem('competitors') || '[]');

        // 添加竞争对手
        function addCompetitor() {
            const url = document.getElementById('competitorUrl').value.trim();
            const name = document.getElementById('competitorName').value.trim();

            if (!url) {
                alert('请输入竞争对手网站URL');
                return;
            }

            try {
                new URL(url);
            } catch (e) {
                alert('请输入有效的URL');
                return;
            }

            const domain = new URL(url).hostname;
            const competitor = {
                id: Date.now(),
                url: url,
                name: name || domain,
                domain: domain,
                // 模拟分析数据
                seoScore: Math.floor(Math.random() * 30) + 60,
                backlinks: Math.floor(Math.random() * 10000) + 500,
                indexedPages: Math.floor(Math.random() * 5000) + 100,
                domainAge: Math.floor(Math.random() * 10) + 1,
                keywords: generateRandomKeywords(),
                traffic: Math.floor(Math.random() * 100000) + 1000,
                addedAt: new Date().toISOString()
            };

            competitors.push(competitor);
            localStorage.setItem('competitors', JSON.stringify(competitors));

            document.getElementById('competitorUrl').value = '';
            document.getElementById('competitorName').value = '';

            renderCompetitors();
        }

        // 生成随机关键词
        function generateRandomKeywords() {
            const keywords = ['SEO优化', '网站推广', '品牌营销', '搜索引擎', '网站优化', '内容营销', '外链建设', '关键词优化', '网站排名', '流量提升'];
            const count = Math.floor(Math.random() * 5) + 3;
            const selected = [];
            for (let i = 0; i < count; i++) {
                const kw = keywords[Math.floor(Math.random() * keywords.length)];
                if (!selected.includes(kw)) selected.push(kw);
            }
            return selected;
        }

        // 渲��竞争对手列表
        function renderCompetitors() {
            if (competitors.length === 0) {
                document.getElementById('competitorListSection').style.display = 'none';
                document.getElementById('compareSection').style.display = 'none';
                return;
            }

            document.getElementById('competitorListSection').style.display = 'block';
            document.getElementById('compareSection').style.display = 'block';

            const grid = document.getElementById('competitorGrid');
            grid.innerHTML = competitors.map(c => `
                <div class="competitor-card">
                    <div class="competitor-header">
                        <div class="competitor-icon">🏢</div>
                        <div>
                            <div class="competitor-name">${c.name}</div>
                            <div class="competitor-url">${c.domain}</div>
                        </div>
                    </div>
                    <div class="competitor-metrics">
                        <div class="metric-item">
                            <div class="metric-value">${c.seoScore}</div>
                            <div class="metric-label">SEO评分</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value">${formatNumber(c.backlinks)}</div>
                            <div class="metric-label">反向链接</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value">${formatNumber(c.indexedPages)}</div>
                            <div class="metric-label">收录页面</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value">${c.domainAge}年</div>
                            <div class="metric-label">域名年龄</div>
                        </div>
                    </div>
                    <div class="keyword-cloud">
                        ${c.keywords.map(kw => `<span class="keyword-tag">${kw}</span>`).join('')}
                    </div>
                    <div style="margin-top: 15px; text-align: right;">
                        <button class="btn-sm" onclick="removeCompetitor(${c.id})">删除</button>
                    </div>
                </div>
            `).join('');

            renderCompare();
        }

        // 格式化数字
        function formatNumber(num) {
            if (num >= 10000) return (num / 10000).toFixed(1) + 'w';
            if (num >= 1000) return (num / 1000).toFixed(1) + 'k';
            return num.toString();
        }

        // 渲染对比分析
        function renderCompare() {
            if (competitors.length < 2) {
                document.getElementById('compareSectionContent').innerHTML = '<p class="empty-state">添加至少2个竞争对手进行对比分析</p>';
                return;
            }

            const sorted = [...competitors].sort((a, b) => b.seoScore - a.seoScore);
            const metrics = [
                { name: 'SEO评分', key: 'seoScore', max: 100 },
                { name: '反向链接', key: 'backlinks', max: Math.max(...competitors.map(c => c.backlinks)) },
                { name: '收录页面', key: 'indexedPages', max: Math.max(...competitors.map(c => c.indexedPages)) },
                { name: '预估流量', key: 'traffic', max: Math.max(...competitors.map(c => c.traffic)) }
            ];

            document.getElementById('compareSectionContent').innerHTML = metrics.map(m => {
                const maxVal = Math.max(...competitors.map(c => c[m.key]));
                return `
                    <div class="compare-card">
                        <div class="compare-header">
                            <strong>${m.name}</strong>
                            <span class="compare-winner">🏆 ${sorted[0].name}</span>
                        </div>
                        ${competitors.map(c => {
                            const percent = (c[m.key] / m.max) * 100;
                            return `
                                <div class="progress-compare">
                                    <span class="label">${c.name}</span>
                                    <div class="bar"><div style="width: ${percent}%; height: 100%; background: var(--primary); border-radius: 4px;"></div></span>
                                    <span class="value">${m.key === 'seoScore' ? c[m.key] : formatNumber(c[m.key])}</span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                `;
            }).join('');
        }

        // 删除竞争对手
        function removeCompetitor(id) {
            competitors = competitors.filter(c => c.id !== id);
            localStorage.setItem('competitors', JSON.stringify(competitors));
            renderCompetitors();
        }

        // 分析关键词策略
        function analyzeKeywordStrategy() {
            const keywords = document.getElementById('mainKeywords').value.split(',').map(k => k.trim()).filter(k => k);
            const domains = document.getElementById('competitorDomains').value.split(',').map(d => d.trim()).filter(d => d);

            if (keywords.length === 0) {
                alert('请输入核心关键词');
                return;
            }

            const result = document.getElementById('keywordStrategyResult');
            result.innerHTML = `
                <div class="result-card success">
                    <h4>📊 关键词策略分析结果</h4>
                    <div style="margin-top: 15px;">
                        <h5>🎯 核心关键词: ${keywords.join(', ')}</h5>
                        <div style="margin-top: 15px;">
                            <strong>竞争分析:</strong>
                            <ul style="margin-top: 10px; padding-left: 20px;">
                                <li>建议优先优化: ${keywords[0]}</li>
                                <li>长尾关键词机会: ${keywords[0]} ${['技巧', '方法', '教程', '工具'][Math.floor(Math.random() * 4)]}</li>
                                <li>内容缺口: 竞争对手覆盖但未涉及的细分领域</li>
                            </ul>
                        </div>
                        <div style="margin-top: 15px;">
                            <strong>📈 优化建议:</strong>
                            <ul style="margin-top: 10px; padding-left: 20px;">
                                <li>创建高质量内容围绕核心关键词</li>
                                <li>建立高质量外链提升页面权重</li>
                                <li>优化页面用户体验降低跳出率</li>
                            </ul>
                        </div>
                    </div>
                </div>
            `;
        }

        // 预估流量
        function estimateTraffic() {
            const url = document.getElementById('trafficUrl').value.trim();
            if (!url) {
                alert('请输入网站URL');
                return;
            }

            const result = document.getElementById('trafficResult');
            result.innerHTML = `
                <div class="result-card">
                    <h4>📈 流量预估分析</h4>
                    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px;">
                        <div class="metric-item">
                            <div class="metric-value">${formatNumber(Math.floor(Math.random() * 50000) + 1000)}</div>
                            <div class="metric-label">日均UV</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value">${formatNumber(Math.floor(Math.random() * 200000) + 5000)}</div>
                            <div class="metric-label">月均PV</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value">${(Math.random() * 5 + 2).toFixed(1)}%</div>
                            <div class="metric-label">跳出率</div>
                        </div>
                        <div class="metric-item">
                            <div class="metric-value">${Math.floor(Math.random() * 10) + 1}</div>
                            <div class="metric-label">平均访问页数</div>
                        </div>
                    </div>
                    <p style="margin-top: 15px; font-size: 12px; color: var(--gray);">* 此数据为基于网站SEO状况的预估，仅供参考</p>
                </div>
            `;
        }

        // 初始化
        renderCompetitors();
    </script>
</body>
</html>
